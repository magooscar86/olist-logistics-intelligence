[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "olist-logistics-intelligence"
version = "1.0.0"
description = "End-to-end ML system for inventory optimization and distribution network analysis"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Oscar Antonio Melo Leon", email = "tu-email@ejemplo.com"}
]
keywords = ["machine-learning", "logistics", "forecasting", "spatial-analysis", "olist", "brazil-ecommerce"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "fastapi>=0.104.1",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "python-multipart>=0.0.6",
    "scikit-learn>=1.3.2",
    "numpy>=1.24.3",
    "pandas>=2.0.3",
    "scipy>=1.11.4",
    "lightgbm>=4.1.0",
    "geopandas>=0.14.1",
    "shapely>=2.0.2",
    "folium>=0.15.0",
    "matplotlib>=3.8.2",
    "seaborn>=0.13.0",
    "networkx>=3.2.1",
    "ipython>=8.18.1",
    "ipywidgets>=8.1.1",
    "ipykernel>=6.25.2",
    "joblib>=1.3.2",
    "python-dateutil>=2.8.2",
    "gunicorn>=21.2.0",
    "pyarrow>=14.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/magooscar86/olist-logistics-intelligence"
Repository = "https://github.com/magooscar86/olist-logistics-intelligence"
Documentation = "https://magooscar86.github.io/olist-logistics-intelligence"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310", "py311"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W"]
ignore = []

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
